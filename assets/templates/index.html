<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clawdfrancois - Claude Mobile Bridge</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 1rem;
            background: white;
            border-radius: 12px;
            padding: 0.5rem;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
        }

        .chat-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 300px);
            max-height: 500px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            word-wrap: break-word;
        }

        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
            max-width: 80%;
        }

        .message.assistant {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
            max-width: 80%;
        }

        .input-area {
            padding: 1.5rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #764ba2;
        }

        .status {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 1rem;
            color: white;
        }

        .status.connected {
            color: #4caf50;
        }

        .status.disconnected {
            color: #f44336;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }

            .chat-container {
                height: calc(100vh - 200px);
            }

            h1 {
                font-size: 1.5rem;
            }

            .message.user,
            .message.assistant {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="/static/logo.png" alt="clawdfrancois Logo">
            </div>
            <h1>clawdfrancois</h1>
            <p class="subtitle">Claude Mobile Bridge</p>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message assistant">Welcome to clawdfrancois! Send a prompt to get started.</div>
            </div>
            <div class="input-area">
                <input type="text" id="promptInput" placeholder="Enter your prompt..." autocomplete="off">
                <button onclick="sendPrompt()">Send</button>
            </div>
        </div>

        <div class="status disconnected" id="status">● Connecting...</div>
    </div>

    <script>
        const promptInput = document.getElementById('promptInput');
        const messagesDiv = document.getElementById('messages');
        const statusDiv = document.getElementById('status');

        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendPrompt();
            }
        });

        function sendPrompt() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            // Add user message to chat
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = prompt;
            messagesDiv.appendChild(userMsg);

            promptInput.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // TODO: Send prompt to backend server
            console.log('Sending prompt:', prompt);
        }

        // Update status indicator
        function updateStatus(connected) {
            if (connected) {
                statusDiv.textContent = '● Connected';
                statusDiv.className = 'status connected';
            } else {
                statusDiv.textContent = '● Disconnected';
                statusDiv.className = 'status disconnected';
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            updateStatus(false);
            // TODO: Connect to WebSocket/Server
        });
    </script>
</body>
</html>
