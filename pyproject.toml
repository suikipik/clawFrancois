[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawdFrancois"
version = "0.1.0"
description = "A local utility for interacting with Claude CLI from a mobile device via Telegram"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "clawdFrancois Contributors"}
]
keywords = ["claude", "telegram", "mobile", "cli", "bridge", "voice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Communications :: Chat",
]
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot>=20.0",
]

[project.optional-dependencies]
voice = ["openai-whisper>=20240314"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/suikipik/clawdfrancois"
Repository = "https://github.com/suikipik/clawdfrancois.git"
Issues = "https://github.com/suikipik/clawdfrancois/issues"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
